{% extends "base.html" %}
{% block content %}
<h1 class="page-title" data-testid="login-title">Login</h1>

<div class="auth-grid">
  <section class="card">
    <h2>Sign in</h2>
    <form class="form" data-testid="login-form" autocomplete="off">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" data-testid="login-email" required>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" data-testid="login-password" required>
      <button type="submit" class="btn btn-primary" data-testid="login-submit">Sign in</button>
      <p class="form-error" data-testid="login-error" role="alert" hidden></p>
    </form>
  </section>

  <section class="card">
    <h2>Create account</h2>
    <form class="form" data-testid="register-form" autocomplete="off">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" name="email" data-testid="register-email" required>
      <label for="reg-password">Password (min 8 chars)</label>
      <input type="password" id="reg-password" name="password" data-testid="register-password" required>
      <button type="submit" class="btn btn-primary" data-testid="register-submit">Register</button>
      <p class="form-error" data-testid="register-error" role="alert" hidden></p>
      <p class="form-ok" data-testid="register-ok" hidden></p>
    </form>
  </section>
</div>
{% endblock %}
